services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartenergy-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartenergy-dashboard
    command: streamlit run app/main.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      SMARTENERGY_API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
